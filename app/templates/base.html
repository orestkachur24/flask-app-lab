
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
        <a class="brand" href="{{ url_for('main') }}">Flask Store</a>
        <nav>

            <a href="{{ url_for('main') }}">Головна</a>
            <a href="{{ url_for('home') }}">Homepage</a>
            <a href="{{ url_for('users.greetings', name='John', age=30) }}">Користувачі</a>
            <a href="{{ url_for('products.index') }}">Товари</a>

        </nav>
        </div>
    </header>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Лабораторна робота №3 — Flask Blueprints</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
