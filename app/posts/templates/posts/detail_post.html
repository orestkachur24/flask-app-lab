{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}<article class="container py-4 post-detail"><a href="{{ url_for('posts.list_posts') }}">← До списку</a><h1 class="mt-3">{{ post.title }}</h1>
<p class="text-muted">{{ post.posted.strftime('%Y-%m-%d %H:%M') }} · {{ post.author }} · {{ post.category.value }}</p><div class="post-content">{{ post.content }}</div>
<div class="d-flex gap-2 mt-4"><a class="btn btn-outline-primary" href="{{ url_for('posts.update_post', post_id=post.id) }}">Редагувати</a><a class="btn btn-outline-danger" href="{{ url_for('posts.delete_post', post_id=post.id) }}">Видалити</a></div></article>{% endblock %}
